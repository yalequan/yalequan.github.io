<!-- start custom head snippets -->

<!-- Load Google Fonts for better typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Custom CSS for warm redesign -->
<link rel="stylesheet" href="{{ '/assets/css/custom-redesign.css' | relative_url }}">

<!-- Academicons (ORCID icon in the sidebar); the files were in the repo but never loaded -->
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}">

<!-- Homepage redesign (Oct 2026); remove this line to revert to the previous look -->
<link rel="stylesheet" href="{{ '/assets/css/home-redesign.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<!-- Lets a page opt out of search indexing with `robots: noindex` in its front matter -->
{% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}

<!-- end custom head snippets -->
